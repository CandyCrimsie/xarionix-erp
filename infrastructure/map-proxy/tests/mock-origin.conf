events {}

http {
    log_format mock '$msec "$request_uri" $status';
    access_log /dev/stdout mock;
    error_log /dev/stderr warn;

    server {
        listen 443 ssl;
        ssl_certificate /tmp/mock-cert.pem;
        ssl_certificate_key /tmp/mock-key.pem;

        location = /v1/tiles/ {
            default_type image/png;
            add_header Cache-Control no-store;
            return 200 'mock-png';
        }

        location / {
            return 404;
        }
    }
}
