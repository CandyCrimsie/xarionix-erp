image: python:3.13-slim

stages:
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

  POSTGRES_USER: "xarionix_test"
  POSTGRES_PASSWORD: "xarionix_test"
  POSTGRES_DB: "xarionix_test"

  TEST_POSTGRES_USER: "xarionix_test"
  TEST_POSTGRES_PASSWORD: "xarionix_test"
  TEST_POSTGRES_DB: "xarionix_test"
  TEST_POSTGRES_HOST: "postgres"
  TEST_POSTGRES_PORT: "5432"

  TEST_REDIS_HOST: "redis"
  TEST_REDIS_PORT: "6379"
  TEST_REDIS_PASSWORD: "xarionix_test"
  TEST_REDIS_DB: "0"

services:
  - name: postgres:18.6
  - name: redis:8-alpine
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --requirepass
      - xarionix_test

cache:
  key:
    files:
      - requirements.txt
      - requirements-dev.txt
  paths:
    - .cache/pip

python-tests:
  stage: test
  before_script:
    - python -m pip install -r requirements-dev.txt
  script:
    - python -m pytest --junitxml=pytest-report.xml
  artifacts:
    when: always
    reports:
      junit: pytest-report.xml
    paths:
      - pytest-report.xml
    expire_in: 1 week

map-proxy-config:
  stage: test
  image: nginx:1.29-alpine
  variables:
    YANDEX_TILES_API_KEY: "ci-placeholder-key"
    MAP_TILES_SIGNING_SECRET: "dGVzdC1tYXAtc2VjcmV0IQ=="
    MAP_TILES_CACHE_SIZE: "64m"
    MAP_TILES_CACHE_TTL: "12h"
    MAP_TILES_CACHE_INACTIVE: "1h"
    MAP_TILES_RPS: "28"
  script:
    - sh infrastructure/map-proxy/validate-map-env.sh
    - cp infrastructure/map-proxy/nginx.conf /etc/nginx/nginx.conf
    - envsubst '${YANDEX_TILES_API_KEY} ${MAP_TILES_SIGNING_SECRET} ${MAP_TILES_CACHE_SIZE} ${MAP_TILES_CACHE_TTL} ${MAP_TILES_CACHE_INACTIVE} ${MAP_TILES_RPS}' < infrastructure/map-proxy/default.conf.template > /etc/nginx/conf.d/default.conf
    - nginx -t


platform-security:
  stage: test
  image: python:3.13.18-slim@sha256:76baad6037690d6e8c4397fbcaef17bca6f19eecef822b708fe8fa3417d30bb5
  services: []
  before_script:
    - python -m pip install -r requirements-dev.txt bandit==1.9.4 pip-audit==2.10.1
  script:
    - bandit -q -r app/core/platform_oidc.py app/core/platform_urls.py app/services/platform_identity.py app/models/platform_bindings.py app/tools/platform_bindings.py
    - pip-audit -r requirements-dev.txt --progress-spinner off

platform-secrets:
  stage: test
  image:
    name: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    entrypoint: [""]
  services: []
  variables:
    GIT_DEPTH: "0"
  script:
    - gitleaks git --redact=100 --no-banner --report-format json --report-path gitleaks.json .
  artifacts:
    when: always
    paths: [gitleaks.json]
    expire_in: 1 week
