image: python:3.13-slim

stages:
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

  POSTGRES_USER: "xarionix_test"
  POSTGRES_PASSWORD: "xarionix_test"
  POSTGRES_DB: "xarionix_test"

  TEST_POSTGRES_USER: "xarionix_test"
  TEST_POSTGRES_PASSWORD: "xarionix_test"
  TEST_POSTGRES_DB: "xarionix_test"
  TEST_POSTGRES_HOST: "postgres"
  TEST_POSTGRES_PORT: "5432"

  TEST_REDIS_HOST: "redis"
  TEST_REDIS_PORT: "6379"
  TEST_REDIS_PASSWORD: "xarionix_test"
  TEST_REDIS_DB: "0"

services:
  - name: postgres:18.6
    alias: postgres
  - name: redis:8-alpine
    alias: redis
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --requirepass
      - xarionix_test

cache:
  key:
    files:
      - requirements.txt
      - requirements-dev.txt
  paths:
    - .cache/pip

python-tests:
  stage: test
  before_script:
    - python -m pip install -r requirements-dev.txt
  script:
    - python -m pytest --junitxml=pytest-report.xml
  artifacts:
    when: always
    reports:
      junit: pytest-report.xml
    paths:
      - pytest-report.xml
    expire_in: 1 week
