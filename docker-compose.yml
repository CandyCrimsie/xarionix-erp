services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xarionix_api
    restart: unless-stopped

    ports:
      - "127.0.0.1:${PORT:-3000}:3000"

    env_file:
      - .env

    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      REDIS_HOST: redis
      REDIS_PORT: 6379

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health', timeout=2)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"

  postgres:
    image: postgres:18.6
    container_name: postgres
    restart: unless-stopped

    ports:
      - "127.0.0.1:5432:5432"

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"

  redis:
    image: redis:8-alpine
    container_name: redis
    restart: unless-stopped

    ports:
      - "127.0.0.1:6379:6379"

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --requirepass
      - ${REDIS_PASSWORD}

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$${REDIS_PASSWORD}" ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"

  map-proxy:
    build:
      context: infrastructure/map-proxy
      dockerfile: Dockerfile
    container_name: xarionix_map_proxy
    restart: unless-stopped

    ports:
      - "127.0.0.1:${MAP_PROXY_PORT:-8088}:8080"

    environment:
      YANDEX_TILES_API_KEY: ${YANDEX_TILES_API_KEY}
      MAP_TILES_SIGNING_SECRET: ${MAP_TILES_SIGNING_SECRET}
      MAP_TILES_CACHE_SIZE: ${MAP_TILES_CACHE_SIZE:-2g}
      MAP_TILES_CACHE_TTL: ${MAP_TILES_CACHE_TTL:-12h}
      MAP_TILES_CACHE_INACTIVE: ${MAP_TILES_CACHE_INACTIVE:-7d}
      MAP_TILES_RPS: ${MAP_TILES_RPS:-28}

    volumes:
      - map_tiles_cache:/var/cache/nginx/map-tiles

    tmpfs:
      - /var/run

    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8080/healthz
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  postgres_data:
  redis_data:
  map_tiles_cache:
